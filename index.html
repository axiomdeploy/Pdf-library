<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Library — Space</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌌</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       FUTURISTIC SPACE THEME
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --neon-cyan: #00f5ff;
      --neon-purple: #bd00ff;
      --neon-pink: #ff0080;
      --neon-blue: #0044ff;
      --bg-dark: #05050a;
      --bg-card: rgba(255, 255, 255, 0.03);
      --glass: rgba(255, 255, 255, 0.05);
      --border-glow: rgba(0, 245, 255, 0.3);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--bg-dark);
      color: #e0e0e0;
      overflow-x: hidden;
      min-height: 100vh;
      cursor: none;
    }

    /* Custom Cursor */
    .cursor {
      position: fixed;
      width: 20px;
      height: 20px;
      border: 2px solid var(--neon-cyan);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transition: all 0.1s ease;
      box-shadow: 0 0 10px var(--neon-cyan), inset 0 0 5px var(--neon-cyan);
    }

    .cursor::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 4px;
      height: 4px;
      background: var(--neon-cyan);
      border-radius: 50%;
    }

    .cursor.clicking {
      transform: scale(0.6);
      border-color: var(--neon-pink);
      box-shadow: 0 0 20px var(--neon-pink);
    }

    @media (max-width: 768px) {
      body { cursor: auto; }
      .cursor { display: none; }
    }

    /* ============================================================
       STARFIELD BACKGROUND
       ============================================================ */
    #starfield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -3;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
    }

    #nebula {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 30%, rgba(189, 0, 255, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(0, 245, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(255, 0, 128, 0.05) 0%, transparent 60%);
      animation: nebulaShift 20s ease-in-out infinite alternate;
    }

    @keyframes nebulaShift {
      0% { transform: scale(1) rotate(0deg); opacity: 0.6; }
      100% { transform: scale(1.1) rotate(2deg); opacity: 1; }
    }

    /* ============================================================
       NAVIGATION
       ============================================================ */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 1.5rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(5,5,10,0.9), transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 245, 255, 0.1);
    }

    .nav-logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
      letter-spacing: 3px;
      text-decoration: none;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: #a0a0a0;
      text-decoration: none;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.3s ease;
      position: relative;
    }

    .nav-links a::before {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--neon-cyan);
      box-shadow: 0 0 8px var(--neon-cyan);
      transition: width 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--neon-cyan);
      text-shadow: 0 0 10px var(--neon-cyan);
    }

    .nav-links a:hover::before {
      width: 100%;
    }

    /* ============================================================
       HERO SECTION — 3D TEXT
       ============================================================ */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      perspective: 1000px;
    }

    .hero-title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 5px;
      color: transparent;
      background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-purple) 50%, var(--neon-pink) 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(0, 245, 255, 0.5));
      animation: titleFloat 3s ease-in-out infinite;
      position: relative;
    }

    .hero-title::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      color: var(--neon-cyan);
      -webkit-text-fill-color: transparent;
      background: none;
      z-index: -1;
      transform: translate(3px, 3px);
      opacity: 0.3;
      filter: blur(2px);
    }

    @keyframes titleFloat {
      0%, 100% { transform: translateY(0) rotateX(0deg); }
      50% { transform: translateY(-15px) rotateX(5deg); }
    }

    .hero-subtitle {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(1rem, 3vw, 1.3rem);
      color: #808080;
      margin-top: 1.5rem;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    .scroll-indicator {
      position: absolute;
      bottom: 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      color: var(--neon-cyan);
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      animation: bounce 2s infinite;
    }

    .scroll-line {
      width: 2px;
      height: 50px;
      background: linear-gradient(to bottom, var(--neon-cyan), transparent);
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px); }
      60% { transform: translateY(-5px); }
    }

    /* ============================================================
       LIBRARY SECTION
       ============================================================ */
    .library {
      padding: 5rem 3rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-header {
      text-align: center;
      margin-bottom: 4rem;
    }

    .section-title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: #e0e0e0;
      margin-bottom: 0.5rem;
    }

    .section-title span {
      color: var(--neon-cyan);
      text-shadow: 0 0 15px var(--neon-cyan);
    }

    .section-line {
      width: 100px;
      height: 3px;
      margin: 1rem auto;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    /* Search & Filter */
    .controls {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 3rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 280px;
      max-width: 500px;
    }

    .search-box input {
      width: 100%;
      padding: 1rem 1.5rem 1rem 3.5rem;
      background: var(--glass);
      border: 1px solid var(--border-glow);
      border-radius: 50px;
      color: #e0e0e0;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      letter-spacing: 1px;
      outline: none;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .search-box input:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 20px rgba(0, 245, 255, 0.3);
    }

    .search-box input::placeholder {
      color: #606060;
    }

    .search-icon {
      position: absolute;
      left: 1.2rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--neon-cyan);
      font-size: 1.1rem;
    }

    .filter-box select {
      padding: 1rem 2rem;
      background: var(--glass);
      border: 1px solid var(--border-glow);
      border-radius: 50px;
      color: #e0e0e0;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      letter-spacing: 1px;
      outline: none;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      appearance: none;
      min-width: 200px;
    }

    .filter-box select:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 20px rgba(0, 245, 255, 0.3);
    }

    .filter-box select option {
      background: #0a0a15;
      color: #e0e0e0;
    }

    /* ============================================================
       PDF CARDS — 3D HOVER EFFECT
       ============================================================ */
    .pdf-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
      perspective: 1200px;
    }

    .pdf-card {
      background: var(--bg-card);
      border: 1px solid rgba(0, 245, 255, 0.15);
      border-radius: 20px;
      padding: 2rem;
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      backdrop-filter: blur(10px);
      opacity: 0;
      transform: translateY(50px);
    }

    .pdf-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .pdf-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 245, 255, 0.05), transparent);
      transition: left 0.5s ease;
    }

    .pdf-card:hover::before {
      left: 100%;
    }

    .pdf-card:hover {
      transform: translateY(-10px) rotateX(5deg) rotateY(-5deg) scale(1.02);
      border-color: var(--neon-cyan);
      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.5),
        0 0 30px rgba(0, 245, 255, 0.2),
        inset 0 0 30px rgba(0, 245, 255, 0.05);
    }

    .card-glow {
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(0, 245, 255, 0.1) 0%, transparent 60%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .pdf-card:hover .card-glow {
      opacity: 1;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1.5rem;
    }

    .card-icon {
      font-size: 2.5rem;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(0, 245, 255, 0.3));
    }

    .card-category {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--neon-cyan);
      background: rgba(0, 245, 255, 0.1);
      border: 1px solid rgba(0, 245, 255, 0.3);
      padding: 0.3rem 1rem;
      border-radius: 50px;
      text-shadow: 0 0 10px var(--neon-cyan);
    }

    .card-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.8rem;
      line-height: 1.4;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    .card-description {
      font-size: 0.95rem;
      color: #909090;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .card-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      padding: 0.9rem 2rem;
      background: linear-gradient(135deg, rgba(0, 245, 255, 0.1), rgba(189, 0, 255, 0.1));
      border: 1px solid var(--neon-cyan);
      border-radius: 50px;
      color: var(--neon-cyan);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-decoration: none;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .card-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 245, 255, 0.2), transparent);
      transition: left 0.3s ease;
    }

    .card-btn:hover {
      background: linear-gradient(135deg, rgba(0, 245, 255, 0.2), rgba(189, 0, 255, 0.2));
      box-shadow: 0 0 20px rgba(0, 245, 255, 0.4);
      text-shadow: 0 0 10px var(--neon-cyan);
      transform: scale(1.05);
    }

    .card-btn:hover::before {
      left: 100%;
    }

    /* ============================================================
       EMPTY STATE
       ============================================================ */
    .empty-state {
      text-align: center;
      padding: 5rem 2rem;
      display: none;
    }

    .empty-state h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      color: #606060;
      margin-bottom: 1rem;
    }

    .empty-state p {
      color: #404040;
    }

    /* ============================================================
       FOOTER
       ============================================================ */
    .footer {
      text-align: center;
      padding: 3rem 2rem;
      margin-top: 5rem;
      border-top: 1px solid rgba(0, 245, 255, 0.1);
      background: linear-gradient(to top, rgba(0, 245, 255, 0.02), transparent);
    }

    .footer p {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #404040;
    }

    .footer span {
      color: var(--neon-cyan);
    }

    /* ============================================================
       SCROLL ANIMATIONS
       ============================================================ */
    .fade-in {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.6s ease;
    }

    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .result-count {
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 2px;
      color: var(--neon-cyan);
      margin-bottom: 2rem;
      text-transform: uppercase;
    }

    /* ============================================================
       MOBILE RESPONSIVE
       ============================================================ */
    @media (max-width: 768px) {
      .nav { padding: 1rem 1.5rem; }
      .nav-links { gap: 1rem; }
      .nav-links a { font-size: 0.7rem; }
      .library { padding: 3rem 1.5rem; }
      .controls { flex-direction: column; align-items: center; }
      .search-box { max-width: 100%; }
      .pdf-grid { grid-template-columns: 1fr; gap: 1.5rem; }
      .pdf-card { padding: 1.5rem; }
      .hero-title { letter-spacing: 2px; }
    }

    @media (max-width: 480px) {
      .nav-links { display: none; }
      .library { padding: 2rem 1rem; }
    }

    /* ============================================================
       LOADING SCREEN
       ============================================================ */
    .loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .loader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      color: var(--neon-cyan);
      text-shadow: 0 0 20px var(--neon-cyan);
      letter-spacing: 5px;
      margin-bottom: 2rem;
      animation: pulse 1.5s infinite;
    }

    .loader-bar {
      width: 200px;
      height: 2px;
      background: rgba(0, 245, 255, 0.2);
      border-radius: 2px;
      overflow: hidden;
    }

    .loader-bar::after {
      content: '';
      display: block;
      width: 50%;
      height: 100%;
      background: var(--neon-cyan);
      box-shadow: 0 0 10px var(--neon-cyan);
      animation: loading 1.5s infinite;
    }

    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div class="loader" id="loader">
    <div class="loader-text">INITIALIZING</div>
    <div class="loader-bar"></div>
  </div>

  <!-- Custom Cursor -->
  <div class="cursor" id="cursor"></div>

  <!-- Background -->
  <canvas id="starfield"></canvas>
  <div id="nebula"></div>

  <!-- Navigation -->
  <nav class="nav">
    <a href="#" class="nav-logo">◆ PDF.LIB</a>
    <ul class="nav-links">
      <li><a href="#library">Library</a></li>
      <li><a href="#footer">Contact</a></li>
    </ul>
  </nav>

  <!-- Hero Section -->
  <section class="hero" id="hero">
    <h1 class="hero-title" data-text="PDF LIBRARY">PDF LIBRARY</h1>
    <p class="hero-subtitle">Explore • Learn • Grow</p>
    <div class="scroll-indicator">
      <span>Scroll Down</span>
      <div class="scroll-line"></div>
    </div>
  </section>

  <!-- Library Section -->
  <section class="library" id="library">
    <div class="section-header fade-in">
      <h2 class="section-title">Access <span>Resources</span></h2>
      <div class="section-line"></div>
    </div>

    <!-- Controls -->
    <div class="controls fade-in">
      <div class="search-box">
        <span class="search-icon">⌕</span>
        <input type="search" id="searchInput" placeholder="Search PDFs..." aria-label="Search">
      </div>
      <div class="filter-box">
        <select id="categoryFilter" aria-label="Filter">
          <option value="">All Categories</option>
        </select>
      </div>
    </div>

    <p class="result-count" id="resultCount"></p>

    <!-- PDF Grid -->
    <div class="pdf-grid" id="pdfGrid"></div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState">
      <h3>NO RESULTS FOUND</h3>
      <p>Try different keywords or categories</p>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer" id="footer">
    <p>© 2026 <span>PDF LIBRARY</span> — All Rights Reserved</p>
  </footer>

  <script>
    // ============================================================
    //  ⭐ PDF DATA — শুধু এই অংশ এডিট করবে ⭐
    // ============================================================
    const pdfData = [

      {
        title: "Physics Note - Chapter 1",
        description: "Motion and Force with detailed examples",
        url: "https://example.com/physics-ch1.pdf",
        category: "Physics"
      },

      {
        title: "Math Formula Sheet",
        description: "All important formulas in one page",
        url: "https://example.com/math-formulas.pdf",
        category: "Math"
      },

      {
        title: "Chemistry Master Q.Bank",
        description: "Versity KA Master Question Bank ",
        url: "https://drive.google.com/file/d/1DHh3Vfcwnx3HSZ3itoAECPHKncHxoVpq/view",
        category: "Chemistry"
      },

      {
        title: "English Grammar Guide",
        description: "Complete grammar for competitive exams",
        url: "https://example.com/english-grammar.pdf",
        category: "English"
      },

      {
        title: "Biology Diagrams",
        description: "All important diagrams with labels",
        url: "https://example.com/biology-diagrams.pdf",
        category: "Biology"
      },

      {
        title: "ICT Full Course",
        description: "Information Technology complete syllabus",
        url: "https://example.com/ict-course.pdf",
        category: "ICT"
      },

    ];

    // ============================================================
    //  STARFIELD BACKGROUND
    // ============================================================
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    let stars = [];
    let shootingStars = [];

    function initCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      createStars();
    }

    function createStars() {
      stars = [];
      const starCount = Math.floor((canvas.width * canvas.height) / 8000);
      for (let i = 0; i < starCount; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 2 + 0.5,
          speed: Math.random() * 0.5 + 0.1,
          opacity: Math.random(),
          twinkle: Math.random() * 0.02 + 0.005
        });
      }
    }

    function createShootingStar() {
      if (Math.random() < 0.01) {
        shootingStars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height * 0.5,
          vx: Math.random() * 6 + 3,
          vy: Math.random() * 3 + 1,
          life: 1
        });
      }
    }

    function animateStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Regular stars
      stars.forEach(star => {
        star.opacity += star.twinkle;
        if (star.opacity > 1 || star.opacity < 0) star.twinkle *= -1;

        star.y += star.speed;
        if (star.y > canvas.height) {
          star.y = 0;
          star.x = Math.random() * canvas.width;
        }

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity * 0.8})`;
        ctx.fill();
      });

      // Shooting stars
      createShootingStar();
      shootingStars = shootingStars.filter(s => s.life > 0);
      shootingStars.forEach(s => {
        s.x += s.vx;
        s.y += s.vy;
        s.life -= 0.01;

        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x - s.vx * 10, s.y - s.vy * 10);
        ctx.strokeStyle = `rgba(0, 245, 255, ${s.life})`;
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      requestAnimationFrame(animateStars);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas();
    animateStars();

    // ============================================================
    //  WEB AUDIO — CLICK SOUNDS
    // ============================================================
    let audioCtx;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playClickSound() {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      // Futuristic beep
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);

      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);

      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.1);
    }

    function playHoverSound() {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);

      gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.05);
    }

    // Click sound on all clicks
    document.addEventListener('click', (e) => {
      playClickSound();

      // Cursor animation
      const cursor = document.getElementById('cursor');
      cursor.classList.add('clicking');
      setTimeout(() => cursor.classList.remove('clicking'), 200);
    });

    // ============================================================
    //  CUSTOM CURSOR
    // ============================================================
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', (e) => {
      cursor.style.left = e.clientX - 10 + 'px';
      cursor.style.top = e.clientY - 10 + 'px';
    });

    // ============================================================
    //  SCROLL EFFECTS (IntersectionObserver)
    // ============================================================
    const observerOptions = {
      threshold: 0.1,
      rootMargin: '0px 0px -50px 0px'
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, observerOptions);

    function observeElements() {
      document.querySelectorAll('.fade-in, .pdf-card').forEach(el => {
        observer.observe(el);
      });
    }

    // ============================================================
    //  RENDER PDFS
    // ============================================================
    const pdfGrid = document.getElementById('pdfGrid');
    const searchInput = document.getElementById('searchInput');
    const categoryFilter = document.getElementById('categoryFilter');
    const emptyState = document.getElementById('emptyState');
    const resultCount = document.getElementById('resultCount');

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || "";
      return div.innerHTML;
    }

    function renderPdfs() {
      const searchTerm = searchInput.value.toLowerCase().trim();
      const selectedCategory = categoryFilter.value;

      const filtered = pdfData.filter(pdf => {
        const matchesSearch =
          !searchTerm ||
          pdf.title.toLowerCase().includes(searchTerm) ||
          (pdf.description && pdf.description.toLowerCase().includes(searchTerm));
        const matchesCategory = !selectedCategory || pdf.category === selectedCategory;
        return matchesSearch && matchesCategory;
      });

      resultCount.textContent = filtered.length > 0
        ? `[ ${filtered.length} FILE${filtered.length !== 1 ? 'S' : ''} FOUND ]`
        : "";

      if (filtered.length === 0) {
        emptyState.style.display = 'block';
        pdfGrid.style.display = 'none';
        return;
      }

      emptyState.style.display = 'none';
      pdfGrid.style.display = 'grid';

      pdfGrid.innerHTML = filtered.map((pdf, index) => `
        <article class="pdf-card" style="transition-delay: ${index * 0.1}s">
          <div class="card-glow"></div>
          <div class="card-header">
            <div class="card-icon">◈</div>
            <span class="card-category">${escapeHtml(pdf.category || 'General')}</span>
          </div>
          <h3 class="card-title">${escapeHtml(pdf.title)}</h3>
          ${pdf.description ? `<p class="card-description">${escapeHtml(pdf.description)}</p>` : ''}
          <a href="${escapeHtml(pdf.url)}" target="_blank" rel="noopener noreferrer" class="card-btn">
            ▶ ACCESS FILE
          </a>
        </article>
      `).join("");

      // Observe new cards
      pdfGrid.querySelectorAll('.pdf-card').forEach(el => observer.observe(el));
    }

    function buildCategoryFilter() {
      const categories = [...new Set(pdfData.map(p => p.category))].filter(Boolean).sort();
      categoryFilter.innerHTML =
        `<option value="">All Categories</option>` +
        categories.map(cat => `<option value="${escapeHtml(cat)}">${escapeHtml(cat)}</option>`).join("");
    }

    searchInput.addEventListener('input', renderPdfs);
    categoryFilter.addEventListener('change', renderPdfs);

    // Hover sound on buttons
    document.addEventListener('mouseover', (e) => {
      if (e.target.matches('.card-btn, .nav-links a, select, input')) {
        playHoverSound();
      }
    });

    // ============================================================
    //  INITIALIZATION
    // ============================================================
    window.addEventListener('load', () => {
      buildCategoryFilter();
      renderPdfs();
      observeElements();

      // Hide loader after 1.5s
      setTimeout(() => {
        document.getElementById('loader').classList.add('hidden');
      }, 1500);
    });
  </script>

</body>
</html>
