<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PDF Library</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2300f0ff'/><text x='50' y='68' font-size='50' font-family='monospace' fill='black' text-anchor='middle' font-weight='bold'>P</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Caveat:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    /* ══════════════════════════════════════════════════════════
       FUTURISTIC NEON — PURE BLACK
       ══════════════════════════════════════════════════════════ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --black: #000000;
      --bg-card: #0a0a0a;
      --bg-card-hover: #0f0f14;
      --neon: #00f0ff;
      --neon-green: #00ff88;
      --neon-purple: #b537f2;
      --neon-pink: #ff2d78;
      --neon-glow: rgba(0, 240, 255, 0.3);
      --text: #e8e8f0;
      --text-dim: #8888a0;
      --border: #1a1a28;
      --font-display: 'Rajdhani', sans-serif;
      --font-hand: 'Caveat', cursive;
      --font-mono: 'Share Tech Mono', monospace;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-display);
      background: var(--black);
      color: var(--text);
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      width: 100%;
      max-width: 100vw;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(0, 240, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.015) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 clamp(1rem, 4vw, 2rem);
      position: relative;
      z-index: 1;
      width: 100%;
    }

    /* ══════════════════════════════════════════════════════════
       SEARCH — Fixed top-right, expandable
       ══════════════════════════════════════════════════════════ */
    .search-wrapper {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .search-toggle {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      color: var(--neon);
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .search-toggle:hover {
      border-color: var(--neon);
      box-shadow: 0 0 15px var(--neon-glow);
    }

    .search-toggle svg {
      width: 20px;
      height: 20px;
    }

    .search-panel {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(15px);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      width: 0;
      opacity: 0;
      transform: translateX(10px);
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .search-wrapper.active .search-panel {
      width: min(280px, calc(100vw - 120px));
      opacity: 1;
      transform: translateX(0);
    }

    .search-panel input {
      width: 100%;
      padding: 0.75rem 0.9rem;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      letter-spacing: 0.5px;
    }

    .search-panel input::placeholder {
      color: #555568;
    }

    .search-clear {
      padding: 0.5rem;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .search-clear:hover { color: var(--neon-pink); }
    .search-clear svg { width: 14px; height: 14px; }

    /* Search result count */
    .search-info {
      position: fixed;
      top: 4rem;
      right: 1rem;
      z-index: 1999;
      padding: 0.6rem 1rem;
      background: rgba(0, 0, 0, 0.92);
      border: 1px solid var(--neon);
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--neon);
      display: none;
      box-shadow: 0 0 20px var(--neon-glow);
    }

    .search-info.show { display: block; }

    /* ══════════════════════════════════════════════════════════
       HEADER
       ══════════════════════════════════════════════════════════ */
    .header {
      padding: clamp(3.5rem, 8vw, 5.5rem) 0 clamp(2rem, 4vw, 3rem);
      text-align: center;
    }

    .header-logo {
      width: 52px;
      height: 52px;
      margin: 0 auto 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(181, 55, 242, 0.1));
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 14px;
      box-shadow: 0 0 25px var(--neon-glow), inset 0 0 15px rgba(0, 240, 255, 0.05);
      animation: logoPulse 3s ease-in-out infinite;
    }

    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 0 25px var(--neon-glow), inset 0 0 15px rgba(0, 240, 255, 0.05); }
      50% { box-shadow: 0 0 40px rgba(0, 240, 255, 0.5), inset 0 0 20px rgba(0, 240, 255, 0.1); }
    }

    .header-logo svg {
      width: 26px;
      height: 26px;
      color: var(--neon);
    }

    .header h1 {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 7vw, 3.8rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #00f0ff 0%, #0088ff 40%, #b537f2 80%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.3));
      margin-bottom: 0.6rem;
      line-height: 1.1;
    }

    .header-subtitle {
      font-family: var(--font-hand);
      font-size: clamp(1.2rem, 3vw, 1.5rem);
      color: var(--text-dim);
      font-weight: 500;
    }

    .header-divider {
      width: 80px;
      height: 2px;
      margin: 1.8rem auto 0;
      background: linear-gradient(90deg, transparent, var(--neon), var(--neon-purple), transparent);
      box-shadow: 0 0 10px var(--neon-glow);
      border-radius: 2px;
    }

    /* ══════════════════════════════════════════════════════════
       SECTIONS
       ══════════════════════════════════════════════════════════ */
    .section {
      margin-bottom: clamp(3rem, 6vw, 4.5rem);
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .section-header::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 60px;
      height: 1px;
      background: var(--neon);
      box-shadow: 0 0 8px var(--neon);
    }

    .section-icon {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 240, 255, 0.06);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 10px;
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.1);
    }

    .section-icon svg {
      width: 20px;
      height: 20px;
      color: var(--neon);
    }

    .section-info { flex: 1; min-width: 0; }

    .section-title {
      font-family: var(--font-display);
      font-size: clamp(1.35rem, 3.5vw, 1.8rem);
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .section-count {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: #555568;
      letter-spacing: 0.1em;
      margin-top: 0.2rem;
      display: block;
    }

    /* ══════════════════════════════════════════════════════════
       SUBJECTS
       ══════════════════════════════════════════════════════════ */
    .subject {
      margin-bottom: 2.5rem;
    }

    .subject-header {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 1.3rem;
    }

    .subject-dot {
      width: 8px;
      height: 8px;
      background: var(--neon);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--neon), 0 0 20px rgba(0, 240, 255, 0.3);
      flex-shrink: 0;
      animation: dotPulse 2s ease-in-out infinite;
    }

    @keyframes dotPulse {
      0%, 100% { box-shadow: 0 0 10px var(--neon), 0 0 20px rgba(0, 240, 255, 0.3); }
      50% { box-shadow: 0 0 15px var(--neon), 0 0 30px rgba(0, 240, 255, 0.5); }
    }

    .subject-name {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--neon);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ══════════════════════════════════════════════════════════
       PDF CARDS — Futuristic with clipped corners
       ══════════════════════════════════════════════════════════ */
    .pdf-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr));
      gap: 1.1rem;
    }

    .pdf-card {
      background: var(--bg-card);
      padding: 1.5rem 1.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      transition: all 0.3s ease;
      position: relative;
      border: 1px solid var(--border);
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
    }

    .pdf-card:hover {
      background: var(--bg-card-hover);
      border-color: rgba(0, 240, 255, 0.4);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.08), inset 0 0 30px rgba(0, 240, 255, 0.02);
      transform: translateY(-3px);
    }

    /* Title + Tag row */
    .pdf-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.7rem;
      flex-wrap: wrap;
    }

    .pdf-title {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.35;
      flex: 1;
      min-width: 140px;
      letter-spacing: 0.02em;
    }

    /* Tags — Monospace techy */
    .pdf-tag {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.7rem;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      white-space: nowrap;
      flex-shrink: 0;
      border-radius: 3px;
    }

    .tag-cyan {
      background: rgba(0, 240, 255, 0.08);
      color: var(--neon);
      border: 1px solid rgba(0, 240, 255, 0.25);
      text-shadow: 0 0 6px rgba(0, 240, 255, 0.4);
    }

    .tag-purple {
      background: rgba(181, 55, 242, 0.08);
      color: #ce93d8;
      border: 1px solid rgba(181, 55, 242, 0.25);
      text-shadow: 0 0 6px rgba(181, 55, 242, 0.4);
    }

    .tag-green {
      background: rgba(0, 255, 136, 0.08);
      color: var(--neon-green);
      border: 1px solid rgba(0, 255, 136, 0.25);
      text-shadow: 0 0 6px rgba(0, 255, 136, 0.4);
    }

    .tag-gold {
      background: rgba(255, 215, 0, 0.08);
      color: #ffd740;
      border: 1px solid rgba(255, 215, 0, 0.25);
      text-shadow: 0 0 6px rgba(255, 215, 0, 0.4);
    }

    .tag-pink {
      background: rgba(255, 45, 120, 0.08);
      color: #ff6ba0;
      border: 1px solid rgba(255, 45, 120, 0.25);
      text-shadow: 0 0 6px rgba(255, 45, 120, 0.4);
    }

    /* Description — Handwritten font */
    .pdf-desc {
      font-family: var(--font-hand);
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--text-dim);
      line-height: 1.5;
    }

    /* ══════════════════════════════════════════════════════════
       LINK BUTTONS
       ══════════════════════════════════════════════════════════ */
    .pdf-links {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-top: auto;
      padding-top: 0.6rem;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.6rem 1.3rem;
      font-family: var(--font-hand);
      font-size: 1.05rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s ease;
      cursor: pointer;
      border: 1px solid transparent;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      position: relative;
      overflow: hidden;
    }

    .link-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .link-primary {
      background: rgba(0, 240, 255, 0.08);
      border-color: rgba(0, 240, 255, 0.35);
      color: var(--neon);
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    }

    .link-primary:hover {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--neon);
      color: #ffffff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.25);
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
    }

    .link-secondary {
      background: rgba(255, 255, 255, 0.03);
      border-color: var(--border);
      color: var(--text-dim);
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    }

    .link-secondary:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.2);
      color: var(--text);
    }

    /* ══════════════════════════════════════════════════════════
       NO RESULTS STATE
       ══════════════════════════════════════════════════════════ */
    .no-results {
      text-align: center;
      padding: 4rem 1rem;
      display: none;
    }

    .no-results.show { display: block; }

    .no-results svg {
      width: 48px;
      height: 48px;
      color: #333348;
      margin-bottom: 1rem;
    }

    .no-results h3 {
      font-family: var(--font-display);
      font-size: 1.2rem;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
    }

    .no-results p {
      font-family: var(--font-hand);
      font-size: 1.1rem;
      color: #555568;
    }

    /* ══════════════════════════════════════════════════════════
       TOAST
       ══════════════════════════════════════════════════════════ */
    #toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(calc(100% + 2rem));
      padding: 0.8rem 1.5rem;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: var(--font-hand);
      font-size: 1.05rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      z-index: 3000;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      max-width: calc(100vw - 2rem);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    }

    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.success { border-color: rgba(0, 255, 136, 0.4); color: var(--neon-green); }
    #toast.error { border-color: rgba(255, 82, 82, 0.4); color: #ff6b6b; }
    #toast svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* ══════════════════════════════════════════════════════════
       FOOTER
       ══════════════════════════════════════════════════════════ */
    .footer {
      text-align: center;
      padding: 3rem 0;
      margin-top: 4rem;
      border-top: 1px solid var(--border);
      position: relative;
    }

    .footer::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 1px;
      background: var(--neon);
      box-shadow: 0 0 10px var(--neon);
    }

    .footer-brand {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--neon);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .footer p {
      font-family: var(--font-hand);
      font-size: 1.05rem;
      color: #444458;
    }

    /* ══════════════════════════════════════════════════════════
       HIDDEN STATE (search filtering)
       ══════════════════════════════════════════════════════════ */
    .hidden-by-search { display: none !important; }

    /* Highlight search matches */
    .search-highlight {
      color: var(--neon);
      text-shadow: 0 0 8px var(--neon-glow);
      font-weight: 700;
    }

    /* ══════════════════════════════════════════════════════════
       RESPONSIVE
       ══════════════════════════════════════════════════════════ */
    @media (max-width: 640px) {
      html, body {
        overflow-x: hidden !important;
        width: 100% !important;
        max-width: 100vw !important;
      }

      .container { padding: 0 1rem; }

      .pdf-grid { grid-template-columns: 1fr; gap: 0.9rem; }

      .pdf-card { padding: 1.3rem 1.4rem; }

      .pdf-title-row { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
      .pdf-links { width: 100%; flex-direction: column; }
      .link-btn { width: 100%; }

      .search-wrapper { top: 0.75rem; right: 0.75rem; }
      .search-info { top: 3.5rem; right: 0.75rem; }

      .section-header { gap: 0.8rem; padding-bottom: 0.8rem; }
      .section-icon { width: 38px; height: 38px; }
      .header h1 { letter-spacing: 0.04em; }
    }

    @media (max-width: 380px) {
      body { font-size: 15px; }
      .container { padding: 0 0.9rem; }
      .pdf-card { padding: 1.1rem 1.2rem; }
      .link-btn { padding: 0.55rem 1rem; }
      .header h1 { font-size: 1.8rem; }
    }

    @media (min-width: 641px) and (max-width: 1023px) {
      .pdf-grid { grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
    }

    @media (min-width: 1024px) {
      .pdf-grid { grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 1.3rem; }
    }

    /* Prevent selection issues */
    .link-btn, .pdf-card { -webkit-touch-callout: none; }

    @supports (-webkit-touch-callout: none) {
      body { -webkit-overflow-scrolling: touch; }
    }
  </style>
</head>
<body>

  <!-- ══════════════════════════════════════════════════════
       FIXED SEARCH — Top Right Corner
       ══════════════════════════════════════════════════════ -->
  <div class="search-wrapper" id="searchWrapper">
    <div class="search-panel" id="searchPanel">
      <input
        type="text"
        id="searchInput"
        placeholder="type to search..."
        aria-label="Search PDFs"
      >
      <button class="search-clear" id="searchClear" aria-label="Clear search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <button class="search-toggle" id="searchToggle" aria-label="Open search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    </button>
  </div>

  <!-- Search Result Count -->
  <div class="search-info" id="searchInfo"></div>

  <div class="container">

    <!-- HEADER -->
    <header class="header">
      <div class="header-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
      </div>
      <h1>PDF Library</h1>
      <p class="header-subtitle">Your study resources, organized.</p>
      <div class="header-divider"></div>
    </header>

    <!-- CONTENT -->
    <div id="content"></div>

    <!-- NO RESULTS -->
    <div class="no-results" id="noResults">

  <!-- Toast -->

  <script>
    // ═══════════════════════════════════════════════════════════

    const libraryData = [

        ]
      },

      // ═══════════ SECTION 2: PREPARATION BOOKS ═══════════
      {

        subjects: [

          {
            name: "Physics",
            pdfs: [
              {

                tag: "Concept Book",

          },

          {

              {

      }

      // ═══════════ নতুন SECTION এখানে যোগ করবে ═══════════
      // উপরের comment এ দেখানো format follow করো
      // শেষ section এর পরে comma (,) দিতে ভুলো না!

    ];

    // ═══════════════════════════════════════════════════════════
    //  SVG ICONS
    // ═══════════════════════════════════════════════════════════
    const icons = {
      target: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>`,
      book: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>`,
      external: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>`,
      check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`,
      x: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`,
      layers: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>`
    };

    // Section এর জন্য icon mapping
    // নতুন section বানালে এখানে icon যোগ করতে পারো
    // Available: target, book, layers
    function getSectionIcon(title) {
      const t = title.toLowerCase();
      if (t.includes('question') || t.includes('q bank')) return icons.target;
      if (t.includes('book') || t.includes('prep')) return icons.book;
      return icons.layers;
    }

    // ═══════════════════════════════════════════════════════════
    //  SOUND SYSTEM
    // ═══════════════════════════════════════════════════════════
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function soundClick() {
      try {
        initAudio();
        const t = audioCtx.currentTime;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.type = 'sine';
        o.frequency.setValueAtTime(880, t);
        o.frequency.exponentialRampToValueAtTime(660, t + 0.04);
        g.gain.setValueAtTime(0.03, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
        o.start(t); o.stop(t + 0.04);
      } catch(e) {}
    }

    function soundSuccess() {
      try {
        initAudio();
        const t = audioCtx.currentTime;
        [523.25, 659.25, 783.99].forEach((freq, i) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g); g.connect(audioCtx.destination);
          o.type = 'sine';
          o.frequency.setValueAtTime(freq, t + i * 0.08);
          g.gain.setValueAtTime(0.04, t + i * 0.08);
          g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.2);
          o.start(t + i * 0.08); o.stop(t + i * 0.08 + 0.2);
        });
      } catch(e) {}
    }

    function soundError() {
      try {
        initAudio();
        const t = audioCtx.currentTime;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.type = 'square';
        o.frequency.setValueAtTime(220, t);
        o.frequency.setValueAtTime(180, t + 0.1);
        g.gain.setValueAtTime(0.03, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        o.start(t); o.stop(t + 0.25);
      } catch(e) {}
    }

    // ═══════════════════════════════════════════════════════════
    //  TOAST
    // ═══════════════════════════════════════════════════════════
    function showToast(msg, type = '') {
      const toast = document.getElementById('toast');
      const iconHtml = type === 'success' ? icons.check : type === 'error' ? icons.x : '';
      toast.innerHTML = `${iconHtml}<span>${esc(msg)}</span>`;
      toast.className = type;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 2400);
    }

    // ═══════════════════════════════════════════════════════════
    //  FUZZY SEARCH — ভুল বানানেও খুঁজে পাবে
    // ═══════════════════════════════════════════════════════════
    function levenshtein(a, b) {
      if (a.length === 0) return b.length;
      if (b.length === 0) return a.length;

      const matrix = [];
      for (let i = 0; i <= b.length; i++) matrix[i] = [i];
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i-1) === a.charAt(j-1)) {
            matrix[i][j] = matrix[i-1][j-1];
          } else {
            matrix[i][j] = Math.min(
              matrix[i-1][j-1] + 1,
              matrix[i][j-1] + 1,
              matrix[i-1][j] + 1
            );
          }
        }
      }
      return matrix[b.length][a.length];
    }

    function fuzzyMatch(query, text) {
      if (!query || !text) return !query;
      query = query.toLowerCase().trim();
      text = text.toLowerCase();

      // 1. Direct substring match
      if (text.includes(query)) return true;

      // 2. Subsequence match (সব character order এ আছে কিনা)
      let qi = 0;
      for (let i = 0; i < text.length && qi < query.length; i++) {
        if (text[i] === query[qi]) qi++;
      }
      if (qi === query.length) return true;

      // 3. Word-based fuzzy match
      const queryWords = query.split(/\s+/).filter(w => w.length > 0);
      const textWords = text.split(/\s+/).filter(w => w.length > 0);

      if (queryWords.length > 0 && textWords.length > 0) {
        const allMatch = queryWords.every(qw => {
          if (qw.length < 2) return textWords.some(tw => tw.includes(qw));
          return textWords.some(tw => {
            if (tw.includes(qw) || qw.includes(tw)) return true;
            const dist = levenshtein(qw, tw);
            return dist <= Math.max(1, Math.floor(Math.min(qw.length, tw.length) / 3));
          });
        });
        if (allMatch) return true;
      }

      // 4. Levenshtein on full strings (short texts only)
      if (text.length < 40 && query.length < 40) {
        const dist = levenshtein(query, text);
        if (dist <= Math.max(2, Math.floor(text.length / 4))) return true;
      }

      return false;
    }

    // ═══════════════════════════════════════════════════════════
    //  SEARCH LOGIC
    // ═══════════════════════════════════════════════════════════
    const searchWrapper = document.getElementById('searchWrapper');
    const searchPanel = document.getElementById('searchPanel');
    const searchInput = document.getElementById('searchInput');
    const searchToggle = document.getElementById('searchToggle');
    const searchClear = document.getElementById('searchClear');
    const searchInfo = document.getElementById('searchInfo');
    const noResults = document.getElementById('noResults');

    // Toggle search
    searchToggle.addEventListener('click', () => {
      searchWrapper.classList.toggle('active');
      if (searchWrapper.classList.contains('active')) {
        setTimeout(() => searchInput.focus(), 100);
      } else {
        clearSearch();
      }
    });

    // Clear button
    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      clearSearch();
      searchInput.focus();
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      // "/" চাপলে search খুলবে
      if (e.key === '/' && !searchWrapper.classList.contains('active') &&
          document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        searchWrapper.classList.add('active');
        setTimeout(() => searchInput.focus(), 100);
      }
      // Escape চাপলে search বন্ধ হবে
      if (e.key === 'Escape') {
        searchWrapper.classList.remove('active');
        clearSearch();
      }
    });

    function clearSearch() {
      searchInput.value = '';
      searchInfo.classList.remove('show');
      filterContent('');
    }

    // Real-time search
    let searchTimer;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        filterContent(searchInput.value);
      }, 200); // Debounce
    });

    function filterContent(query) {
      query = query.toLowerCase().trim();
      const allCards = document.querySelectorAll('.pdf-card');
      const allSubjects = document.querySelectorAll('.subject');
      const allSections = document.querySelectorAll('.section');

      if (!query) {
        // Show everything
        allCards.forEach(c => c.classList.remove('hidden-by-search'));
        allSubjects.forEach(s => s.classList.remove('hidden-by-search'));
        allSections.forEach(s => s.classList.remove('hidden-by-search'));
        searchInfo.classList.remove('show');
        noResults.classList.remove('show');
        return;
      }

      let totalMatches = 0;

      // Filter each PDF card
      allCards.forEach(card => {
        const searchable = card.dataset.search || '';
        const matches = fuzzyMatch(query, searchable);
        card.classList.toggle('hidden-by-search', !matches);
        if (matches) totalMatches++;
      });

      // Hide empty subjects
      allSubjects.forEach(sub => {
        const visibleCards = sub.querySelectorAll('.pdf-card:not(.hidden-by-search)');
        sub.classList.toggle('hidden-by-search', visibleCards.length === 0);
      });

      // Hide empty sections
      allSections.forEach(sec => {
        const visibleSubjects = sec.querySelectorAll('.subject:not(.hidden-by-search)');
        sec.classList.toggle('hidden-by-search', visibleSubjects.length === 0);
      });

      // Show result count
      if (totalMatches > 0) {
        searchInfo.textContent = `${totalMatches} result${totalMatches !== 1 ? 's' : ''} found`;
        searchInfo.classList.add('show');
        noResults.classList.remove('show');
      } else {
        searchInfo.textContent = '0 results';
        searchInfo.classList.add('show');
        noResults.classList.add('show');
      }
    }

    // ═══════════════════════════════════════════════════════════
    //  RENDER
    // ═══════════════════════════════════════════════════════════
    function esc(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    function renderLibrary() {
      const content = document.getElementById('content');
      let html = '';

      libraryData.forEach(section => {
        const totalPdfs = section.subjects.reduce(
          (sum, s) => sum + (s.pdfs ? s.pdfs.length : 0), 0
        );

        html += `<section class="section" data-search="${esc(section.title)}">`;

        // Section header
        html += `
          <div class="section-header">
            <div class="section-icon">${getSectionIcon(section.title)}</div>
            <div class="section-info">
              <h2 class="section-title">${esc(section.title)}</h2>
              <span class="section-count">${totalPdfs} FILE${totalPdfs !== 1 ? 'S' : ''}</span>
            </div>
          </div>
        `;

        // Subjects
        section.subjects.forEach(subject => {
          html += `<div class="subject" data-search="${esc(subject.name)}">`;
          html += `
            <div class="subject-header">
              <span class="subject-dot"></span>
              <h3 class="subject-name">${esc(subject.name)}</h3>
            </div>
          `;

          if (!subject.pdfs || subject.pdfs.length === 0) {
            html += `<p style="font-family:var(--font-hand);color:#444458;font-size:1.1rem;padding:0.5rem 0;">Coming soon...</p>`;
          } else {
            html += `<div class="pdf-grid">`;

            subject.pdfs.forEach(pdf => {
              // Build searchable text
              const searchableParts = [
                pdf.title, pdf.desc, pdf.tag,
                subject.name, section.title
              ].filter(Boolean).join(' ');

              html += `<article class="pdf-card" data-search="${esc(searchableParts)}">`;

              // Title + Tag
              html += `<div class="pdf-title-row">`;
              html += `<h4 class="pdf-title">${esc(pdf.title)}</h4>`;
              if (pdf.tag) {
                html += `<span class="pdf-tag tag-${pdf.tagColor || 'cyan'}">${esc(pdf.tag)}</span>`;
              }
              html += `</div>`;

              // Description
              if (pdf.desc) {
                html += `<p class="pdf-desc">${esc(pdf.desc)}</p>`;
              }

              // Links
              const validLinks = (pdf.links || []).filter(
                l => l.url && l.url.trim() !== ''
              );

              if (validLinks.length > 0) {
                html += `<div class="pdf-links">`;
                validLinks.forEach((link, idx) => {
                  const cls = idx === 0 ? 'link-primary' : 'link-secondary';
                  html += `
                    <a href="${esc(link.url)}"
                       target="_blank"
                       rel="noopener noreferrer"
                       class="link-btn ${cls}"
                       onclick="onOpen()">
                      ${icons.external}
                      ${esc(link.label)}
                    </a>
                  `;
                });
                html += `</div>`;
              }

              html += `</article>`;
            });

            html += `</div>`;
          }

          html += `</div>`;
        });

        html += `</section>`;
      });

      content.innerHTML = html;
    }

    // ═══════════════════════════════════════════════════════════
    //  HANDLERS
    // ═══════════════════════════════════════════════════════════
    window.onOpen = function() {
      soundSuccess();
      showToast('Opening PDF...', 'success');
    };

    document.addEventListener('click', (e) => {
      if (!e.target.closest('a') && !e.target.closest('button')) {
        soundClick();
      }
    });

    // Prevent double-tap zoom
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, false);

    // ═══════════════════════════════════════════════════════════
    //  INIT
    // ═══════════════════════════════════════════════════════════
    renderLibrary();
  </script>
